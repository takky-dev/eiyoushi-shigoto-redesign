<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>応募する | えいようしごと</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site">
  <div class="header-row">
    <a href="index.html" class="brand">
      <span class="brand-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v6a3 3 0 0 0 6 0V3"/><path d="M11 9v12"/></svg></span>
      <span><span class="brand-name">えいようしごと</span><span class="brand-tag">栄養士・管理栄養士専門の求人サイト</span></span>
    </a>
  </div>
</header>

<main>
  <section>
    <div class="wrap" style="max-width:640px;">
      <div class="breadcrumb"><a href="index.html">TOP</a> ＞ <a href="job.html">求人詳細</a> ＞ 応募する</div>
      <div class="section-head" style="display:block;">
        <span class="kicker">APPLY</span>
        <h2>応募する</h2>
        <p style="color:var(--ink-soft);font-size:0.9rem;margin-top:10px;">入力は1分程度です。以下の内容を確認のうえ、応募企業へ送信します。</p>
      </div>

      <div class="apply-note">
        送信後、応募企業の採用担当者より3営業日以内にご連絡いたします。マイページから応募状況をいつでも確認できます。
      </div>

      <form class="apply-form" onsubmit="return false;">
        <div class="field" style="background:var(--accent-tint);padding:14px 16px;border-radius:var(--radius-s);margin-bottom:22px;">
          <label style="margin-bottom:4px;">応募先求人</label>
          <div style="font-weight:700;">西新宿総合病院 栄養管理科 ／ 管理栄養士（常勤）</div>
        </div>

        <div class="field">
          <label for="name">お名前<span class="required">必須</span></label>
          <input id="name" type="text" placeholder="例）栄養 花子" required>
        </div>
        <div class="field">
          <label for="kana">フリガナ<span class="required">必須</span></label>
          <input id="kana" type="text" placeholder="例）エイヨウ ハナコ" required>
        </div>
        <div class="field">
          <label for="tel">電話番号<span class="required">必須</span></label>
          <input id="tel" type="tel" placeholder="例）090-1234-5678" required>
        </div>
        <div class="field">
          <label for="email">メールアドレス<span class="required">必須</span></label>
          <input id="email" type="email" placeholder="例）hanako@example.com" required>
        </div>
        <div class="field">
          <label for="qualification">お持ちの資格</label>
          <select id="qualification">
            <option>選択してください</option>
            <option>管理栄養士</option>
            <option>栄養士</option>
            <option>資格取得見込み</option>
          </select>
        </div>
        <div class="field">
          <label for="status">現在の就業状況</label>
          <select id="status">
            <option>選択してください</option>
            <option>在職中</option>
            <option>離職中</option>
          </select>
        </div>
        <div class="field">
          <label for="resume">履歴書・職務経歴書（任意）</label>
          <input id="resume" type="file" accept=".pdf,.doc,.docx">
        </div>
        <div class="field">
          <label for="note">自己PR・ご質問（任意）</label>
          <textarea id="note" placeholder="アピールポイントや、企業への質問があればご記入ください"></textarea>
        </div>

        <button type="submit" class="btn btn-warm" style="width:100%;padding:16px;font-size:1rem;">この内容で応募する</button>
        <p style="font-size:0.76rem;color:var(--ink-soft);margin-top:14px;text-align:center;">送信内容は<a href="#" style="color:var(--accent-strong);">プライバシーポリシー</a>に基づき適切に管理します。</p>
      </form>
    </div>
  </section>
</main>

<footer>
  <div class="wrap foot-bottom" style="border-top:1px solid var(--line);padding-top:20px;"><span>© 2026 えいようしごと</span><span>栄養士・管理栄養士専門の求人サイト</span></div>
</footer>

</body>
</html>
